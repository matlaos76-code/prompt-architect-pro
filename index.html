kt: Prompt Architect Pro. Dane z 15 rozmów: boją się że AI zabierze pracę, nie mają czasu uczyć zespołu, szef każe 'robić AI'. Budżet: $50-300/mies.",ograniczenia:"Bez ogólników typu 'ceni sobie jakość', każdy ból z cytatem z rozmowy, max 450 słów, konkretne kanały (np. Slack Community X)",format:"Tabela: Persona | Bóle (cytat) | Cele | Gdzie jest online | Trigger zakupu | Obiekcje | Jak do niego mówić"},{id:"code-reviewer",kat:"Kod/IT",nazwa:"Code Reviewer",emoji:"\uD83D\uDC68‍\uD83D\uDCBB",opis:"Znajdź 3 bugi i 2 smaki",cel:"Kod",model:"ChatGPT-4o",rola:"Krytyk",technika:"Chain-of-Thought",zadanie:"Przejrzyj kod [WKLEJ KOD] pod kątem bugów, bezpieczeństwa, wydajności i czytelności. Zaproponuj poprawki z wyjaśnieniem.",kontekst:"Stack: Next.js 14, TypeScript, Prisma, Tailwind. Zespół 3 devów, PR ~200 linii. Priorytet: bezpieczeństwo + wydajność > styl.",ograniczenia:"Max 5 komentarzy krytycznych, każdy z: lokalizacja, problem, fix, dlaczego. Bez stylistycznych pierdół typu 'brak spacji'",format:"Lista: [CRITICAL/MAJOR/MINOR] plik:linia - Problem - Fix (kod) - Dlaczego"},{id:"debugowanie",kat:"Kod/IT",nazwa:"Debugowanie",emoji:"\uD83D\uDC1B",opis:"5 hipotez + najtańszy test",cel:"Kod",model:"Claude 3.5 Sonnet",rola:"Ekspert Branżowy",technika:"Tree-of-Thoughts",zadanie:"Pomóż zdebugować: [OPISZ BŁĄD + LOGI + KOD]. Nie zgaduj - daj 5 hipotez od najbardziej prawdopodobnej, każda z testem falsyfikującym.",kontekst:"Błąd: [np. hydration error w Next.js tylko na prod]. Występuje w 10% sesji. Logi: [wklej]. Ostatnie zmiany: [opis].",ograniczenia:"5 hipotez uszeregowanych P(prob), każda z testem <15 min, bez 'spróbuj zrestartować' bez uzasadnienia",format:"Hipoteza | Prawdopodobieństwo | Jak przetestować (krok) | Co jeśli potwierdzona"},{id:"sql-optimizer",kat:"Kod/IT",nazwa:"SQL Optimizer",emoji:"\uD83D\uDDC4️",opis:"Z 12s do 80ms",cel:"Kod",model:"ChatGPT-4o",rola:"Ekspert Branżowy",technika:"Chain-of-Thought",zadanie:"Zoptymalizuj zapytanie SQL [WKLEJ SQL + EXPLAIN]. Cel: <100ms na 1M wierszy. Zaproponuj indeksy i rewrite.",kontekst:"Baza: Postgres 15, tabela orders 1.2M wierszy, brak indeksów poza PK. Zapytanie wołane 200x/min. EXPLAIN: [wklej].",ograniczenia:"3 wersje: szybki fix (indeks), średni (rewrite), idealny (materialized view), każda z kosztem i zyskiem",format:"Oryginał + EXPLAIN analiza + Wersja 1/2/3 + Indeksy SQL + Szacunkowy zysk"},{id:"regex-generator",kat:"Kod/IT",nazwa:"Regex Generator",emoji:"\uD83D\uDD24",opis:"Bez StackOverflow",cel:"Kod",model:"ChatGPT-4o",rola:"Analityk Danych",technika:"Few-Shot",zadanie:"Wygeneruj regex dla [OPISZ WZORZEC - np. polski NIP, email firmowy bez gmail, URL z UTM]. Dodaj testy pozytywne/negatywne.",kontekst:"Język: JavaScript (RE2 safe). Ma działać w Zod validation. Przykłady poprawnych: [podaj]. Niepoprawnych: [podaj].",ograniczenia:"Regex + wyjaśnienie token po tokenie + 5 testów pass/fail, bez lookbehind jeśli niepotrzebny",format:"Regex: /.../ + Rozbiórka: token = znaczenie + Testy: ✅/❌"},{id:"dokumentacja-kodu",kat:"Kod/IT",nazwa:"Dokumentacja kodu",emoji:"\uD83D\uDCDA",opis:"README które ktoś przeczyta",cel:"Kod",model:"Claude 3.5 Sonnet",rola:"Mentor",technika:"Zero-Shot + Context",zadanie:"Wygeneruj dokumentację dla [WKLEJ KOD / REPO STRUCTURE]. Ma pozwolić nowemu devowi zacząć w 30 min.",kontekst:"Projekt: Prompt Architect Pro, stack: React + Vite, 3 devów, brak docs. Najważniejsze: jak odpalić, jak dodać nowy typ promptu, jak działa scoring.",ograniczenia:"Max 400 słów, styl: README seniora, nie juniora - bez 'to jest funkcja która...', przykłady użycia obowiązkowe",format:"## Quick Start | ## Architektura (1 diagram ASCII) | ## Jak dodać X | ## Gotchas"},{id:"podsumowanie-raportu",kat:"Analiza",nazwa:"Podsumowanie raportu",emoji:"\uD83D\uDCCA",opis:"100 stron w 10 bulletach",cel:"Analiza",model:"Gemini 2.0",rola:"Analityk Danych",technika:"Zero-Shot + Context",zadanie:"Podsumuj raport [WKLEJ TREŚĆ / LINK] w 10 bulletach + 3 wnioski + 1 rekomendacja 'co zrobić jutro'.",kontekst:"Raport: 120 stron, McKinsey AI 2025. Odbiorca: zarząd, 5 min czasu. Potrzebne: liczby, nie opinie.",ograniczenia:"10 bulletów max 15 słów każdy, każdy z liczbą/procentem, bez cytowania wstępu, ton zarządowy",format:"TL;DR (1 zdanie) | 10 bulletów z danymi | 3 wnioski | Jutro: 1 akcja"},{id:"analiza-swot",kat:"Analiza",nazwa:"Analiza SWOT",emoji:"⚖️",opis:"Bez bullshitu, z wagą",cel:"Analiza",model:"Claude 3.5 Sonnet",rola:"Strateg",technika:"Chain-of-Thought",zadanie:"Stwórz SWOT dla [FIRMA/PRODUKT] który nie jest laurką. Każde pole z wagą 1-5 i dowodem.",kontekst:"Firma: Prompt Architect Pro, 4 osoby, $3k MRR, brak sales, mocny product, słaby distribution. Konkurenci: well-funded US SaaS.",ograniczenia:"Każdy punkt z dowodem/liczbą, bez 'duży potencjał', 3 punkty na ćwiartkę, na końcu 1 ruch strategiczny",format:"Tabela SWOT: Punkt | Waga | Dowód + Sekcja: Konkluzja SO/WO/ST/WT + 1 ruch na 30 dni"},{id:"wycena-spolki",kat:"Analiza",nazwa:"Wycena spółki",emoji:"\uD83D\uDC8E",opis:"3 metody + widełki",cel:"Analiza",model:"Claude 3.5 Sonnet",rola:"Analityk Danych",technika:"Tree-of-Thoughts",zadanie:"Zwycen spółkę [OPISZ] 3 metodami: DCF uproszczony, mnożnikowy, VC method. Podaj widełki i uzasadnij.",kontekst:"SaaS: $3k MRR, growth 18% MoM, churn 7%, koszty $5k/mies, zespół 4, brak długu. Rynek: 5x ARR dla podobnych w PL.",ograniczenia:"Każda metoda z założeniami, bez ukrywania założeń, widełki min/base/max, zastrzeżenia",format:"Metoda | Założenia | Wynik | Ryzyko + Tabela zbiorcza widełek + rekomendacja ceny transakcyjnej"},{id:"research-rynkowy",kat:"Analiza",nazwa:"Research rynkowy",emoji:"\uD83C\uDF0D",opis:"TAM/SAM/SOM w 1h",cel:"Analiza",model:"Gemini 2.0",rola:"Analityk Danych",technika:"Zero-Shot + Context",zadanie:"Policz TAM/SAM/SOM dla [RYNEK] w [GEO]. Zidentyfikuj 3 segmenty o najwyższym willingness to pay i 2 trendy.",kontekst:"Produkt: narzędzie do promptów dla marketingu. GEO: PL + CEE + DACH. Źródła: GUS, Statista, LinkedIn Sales Navigator.",ograniczenia:"Liczby z źródłem, nie zgaduj - jeśli brak danych to podaj przedział i założenie, max 500 słów",format:"TAM | SAM | SOM (liczby + źródło) + 3 segmenty (wielkość, WTP, ból) + 2 trendy + wniosek Go/No-Go"},{id:"tlumaczenie-prawnicze",kat:"Analiza",nazwa:"Tłumaczenie prawnicze",emoji:"⚖️",opis:"PL-EN bez utraty mocy",cel:"Tekst",model:"Claude 3.5 Sonnet",rola:"Ekspert Branżowy",technika:"Instruction + Constraints",zadanie:"Przetłumacz dokument prawniczy [WKLEJ TEKST PL] na angielski prawniczy (UK English) zachowując moc prawną i terminologię. Zaznacz niepewne tłumaczenia.",kontekst:"Dokument: umowa B2B SaaS, klauzule: RODO, IP, liability. Odbiorca: prawnik US. Wymagana precyzja > płynność.",ograniczenia:"Nie upraszczaj terminów prawnych, zachowaj numerację, dodaj [NOTE: ...] przy wątpliwościach, bez tłumaczenia nazw własnych",format:"Tłumaczenie 1:1 z numeracją + Sekcja: Terminy kluczowe PL->EN + Uwagi tłumacza"}],Id={"analiza-konkurencji":{nazwa:"Competitor Analysis",opis:"Benchmark 5 players + gaps",zadanie:"Analyze 5 competitors in niche [ENTER NICHE] by offer, pricing, SEO positioning and USP. Identify 3 market gaps we can attack in 30 days.",kontekst:"Company: B2B SaaS for marketing automation. Market: US + EU. Analysis budget: 10h. Provide 3-5 competitors + links.",ograniczenia:"Comparison table + 3 tactical recommendations, analytical tone, no fluff, max 600 words, each gap with evidence",format:`Markdown Table: Company | Offer | Price | Strengths/Weaknesses | Insight

Section: 3 market gaps prioritized with RICE`},"cold-email":{nazwa:"Cold Email Outreach",opis:"3-email sequence with A/B",zadanie:"Write a 3-step cold email sequence to [ROLE] at [INDUSTRY 50-200 people] companies selling [PRODUCT]. Goal: book a 15-min demo.",kontekst:"ICP: Head of Marketing, frustration: manual prompt writing, no time. USP: prompt generator saves 7h/week. Social proof: 200+ teams.",ograniczenia:"Max 75 words per email, human tone, no buzzwords, 1 CTA, personalization {{company}} {{pain}}, no 'hope you're well'",format:"Email 1/2/3: Subject A/B + Body + PS + A/B test variant"},"opis-produktu":{nazwa:"Product Description",opis:"AIDA + benefits not features",zadanie:"Write a product description for [NAME] for pricing/landing page that converts skeptical buyers. Focus on transformation, not features.",kontekst:"Product: Prompt Architect Pro - generates ready-to-use prompts for marketing teams. Price $29/mo. Competitors write 'AI-powered revolutionary'. We don't.",ograniczenia:"3 versions: short (25 words), medium (80 words), long (150 words), expert tone, banned words: innovative, revolutionary, cutting-edge",format:"Headline H1 + subheader + 3 benefit bullets + CTA. 3 tone variants: expert, friendly, provocative"},"strategia-cenowa":{nazwa:"Pricing Strategy",opis:"3 pricing models with LTV",zadanie:"Propose 3 pricing models for SaaS [DESCRIBE PRODUCT] with ARPU $20-100. Include freemium vs trial, annual discount and expansion revenue.",kontekst:"Currently: $29 flat, churn 8%, CAC $120, LTV $360. Goal: ARPU $49, churn <5%. Segments: solo, team 5, agency 20. Market US + EU.",ograniczenia:"Each model with LTV/CAC math, breakeven and risk. Max 500 words, no pricing tables without justification",format:"Table: Model | Price | For whom | LTV | Risk | When to choose + final recommendation"},"pitch-deck":{nazwa:"Pitch Deck Outline",opis:"10 slides that close",zadanie:"Create a 10-slide pitch deck outline for pre-seed investor. Product: [DESCRIBE]. Goal: $500k for 12mo runway.",kontekst:"Traction: $3k MRR, 120 users, 2 case studies. Team 4 ex-Allegro/Vercel. Market $2B. Problem: companies waste 10h/week on prompts.",ograniczenia:"Each slide: title + 3 bullets max + 1 insight, confident but not arrogant tone, no 'We are the Uber for...' slide",format:"Slides 1-10: Title | Key thesis | What to show | Anti-pattern"},"linkedin-viral":{nazwa:"Viral LinkedIn Post",opis:"Scroll-stopping hook",zadanie:"Write a viral LinkedIn post about [TOPIC] that drives comments from ICP (Head of Marketing). Personal story + lesson + CTA without selling.",kontekst:"Author: B2B SaaS founder, 2k followers, style: honest, no corporate, slightly provocative. Recent posts: teardowns, behind the scenes. No motivational threads.",ograniczenia:"Max 180 words, 5 paragraphs max, 1-2 emoji, hook <12 words first line, ends with open question, no hashtags",format:"Hook | Story (3 sentences) | Twist | Lesson (list of 3) | Question"},"skrypt-reels":{nazwa:"Reels Script",opis:"30s hook + 3 scenes",zadanie:"Write a 30s Reels/TikTok script: [TOPIC]. Must stop scroll in 1.5s, deliver value and end with CTA 'comment WORD'.",kontekst:"Channel: educational for marketers, style: fast cuts, captions, B-roll. Persona: 25-35yo marketer, hates cringe. Product: prompt generator.",ograniczenia:"30s = ~75 words, dynamic tone, 3 scenes + on-screen captions, no 'Hey guys'",format:"[0-3s HOOK] | [3-15s VALUE] | [15-27s PROOF] | [27-30s CTA] + B-roll list and captions"},"seo-artykul":{nazwa:"SEO Article Brief",opis:"Brief that ranks",zadanie:"Create a 2000-word SEO article outline for keyword [KEYWORD] that beats Google top3. Include intent, E-E-A-T and featured snippet.",kontekst:"Domain: SaaS blog about AI prompts, DR 25, competitors: Hubspot, Jasper blog. Goal: top3 in 60 days. Keyword: e.g. 'how to write ChatGPT prompts'.",ograniczenia:"Outline with H2/H3, each H2 with intent, keywords and FAQ question, no generic intros like 'In the age of AI...'",format:"Table: H2 | Intent | Keywords | Sources | Snippet opportunity + FAQ 5 questions"},newsletter:{nazwa:"Newsletter Issue",opis:"Week in 5 links + insight",zadanie:"Write newsletter [NAME] - issue about [TOPIC OF THE WEEK]. 1 insight + 3 links + 1 tool + 1 question to readers.",kontekst:"List 1200 people, open rate 42%, click 6%. Readers: B2B marketers. Tone: like email to a friend who knows more. No promo every week.",ograniczenia:"Max 350 words, human tone, 1 emoji per section, no clickbait, each link with 1-sentence 'why worth it'",format:"Subject A/B + Preview + Intro (2 sentences) + Insight + 3 Links + Tool of the week + Question"},"analiza-persony":{nazwa:"ICP Persona Deep Dive",opis:"ICP with pains & triggers",zadanie:"Create detailed ICP persona: [ROLE] in [INDUSTRY]. Identify 5 pains, 3 goals, where they hang out, what triggers purchase.",kontekst:"Product: Prompt Architect Pro. Data from 15 interviews: fear AI will take jobs, no time to train team, boss says 'do AI'. Budget: $50-300/mo.",ograniczenia:"No generic like 'values quality', each pain with interview quote, max 450 words, specific channels (e.g. Slack Community X)",format:"Table: Persona | Pains (quote) | Goals | Where online | Purchase trigger | Objections | How to talk to them"},"code-reviewer":{nazwa:"Code Reviewer",opis:"Find 3 bugs & 2 smells",zadanie:"Review code [PASTE CODE] for bugs, security, performance and readability. Suggest fixes with explanation.",kontekst:"Stack: Next.js 14, TypeScript, Prisma, Tailwind. Team 3 devs, PR ~200 lines. Priority: security + performance > style.",ograniczenia:"Max 5 critical comments, each with: location, problem, fix, why. No nitpicks like 'missing space'",format:"List: [CRITICAL/MAJOR/MINOR] file:line - Problem - Fix (code) - Why"},debugowanie:{nazwa:"Debugging Assistant",opis:"5 hypotheses + cheapest test",zadanie:"Help debug: [DESCRIBE BUG + LOGS + CODE]. Don't guess - give 5 hypotheses from most probable, each with falsifiable test.",kontekst:"Bug: [e.g. hydration error in Next.js only on prod]. Occurs in 10% sessions. Logs: [paste]. Recent changes: [desc].",ograniczenia:"5 hypotheses ranked P(prob), each with test <15 min, no 'try restarting' without justification",format:"Hypothesis | Probability | How to test (step) | What if confirmed"},"sql-optimizer":{nazwa:"SQL Optimizer",opis:"From 12s to 80ms",zadanie:"Optimize SQL query [PASTE SQL + EXPLAIN]. Goal: <100ms on 1M rows. Suggest indexes and rewrite.",kontekst:"DB: Postgres 15, table orders 1.2M rows, no indexes except PK. Query called 200x/min. EXPLAIN: [paste].",ograniczenia:"3 versions: quick fix (index), medium (rewrite), ideal (materialized view), each with cost and gain",format:"Original + EXPLAIN analysis + Version 1/2/3 + Indexes SQL + Estimated gain"},"regex-generator":{nazwa:"Regex Generator",opis:"No StackOverflow needed",zadanie:"Generate regex for [DESCRIBE PATTERN - e.g. VAT ID, business email no gmail, URL with UTM]. Add positive/negative tests.",kontekst:"Language: JavaScript (RE2 safe). Must work in Zod validation. Valid examples: [provide]. Invalid: [provide].",ograniczenia:"Regex + token-by-token explanation + 5 pass/fail tests, no lookbehind if not needed",format:"Regex: /.../ + Breakdown: token = meaning + Tests: ✅/❌"},"dokumentacja-kodu":{nazwa:"Code Documentation",opis:"README people actually read",zadanie:"Generate documentation for [PASTE CODE / REPO STRUCTURE]. Should let new dev start in 30 min.",kontekst:"Project: Prompt Architect Pro, stack: React + Vite, 3 devs, no docs. Most important: how to run, how to add new prompt type, how scoring works.",ograniczenia:"Max 400 words, style: senior's README not junior's - no 'this is a function that...', usage examples mandatory",format:"## Quick Start | ## Architecture (1 ASCII diagram) | ## How to add X | ## Gotchas"},"podsumowanie-raportu":{nazwa:"Report Summary",opis:"100 pages in 10 bullets",zadanie:"Summarize report [PASTE CONTENT / LINK] in 10 bullets + 3 insights + 1 recommendation 'what to do tomorrow'.",kontekst:"Report: 120 pages, McKinsey AI 2025. Audience: C-level, 5 min time. Need numbers, not opinions.",ograniczenia:"10 bullets max 15 words each, each with number/percentage, no quoting intro, executive tone",format:"TL;DR (1 sentence) | 10 bullets with data | 3 insights | Tomorrow: 1 action"},"analiza-swot":{nazwa:"SWOT Analysis",opis:"No BS, with weight",zadanie:"Create SWOT for [COMPANY/PRODUCT] that's not a love letter. Each field with weight 1-5 and evidence.",kontekst:"Company: Prompt Architect Pro, 4 people, $3k MRR, no sales, strong product, weak distribution. Competitors: well-funded US SaaS.",ograniczenia:"Each point with proof/number, no 'huge potential', 3 points per quadrant, ends with 1 strategic move",format:"SWOT Table: Point | Weight | Evidence + Section: SO/WO/ST/WT Conclusion + 1 move for 30 days"},"wycena-spolki":{nazwa:"Company Valuation",opis:"3 methods + range",zadanie:"Value company [DESCRIBE] with 3 methods: simplified DCF, multiple, VC method. Give range and justify.",kontekst:"SaaS: $3k MRR, growth 18% MoM, churn 7%, costs $5k/mo, team 4, no debt. Market: 5x ARR for similar in PL.",ograniczenia:"Each method with assumptions, don't hide assumptions, range min/base/max, disclaimers",format:"Method | Assumptions | Result | Risk + Summary table of ranges + recommended transaction price"},"research-rynkowy":{nazwa:"Market Research",opis:"TAM/SAM/SOM in 1h",zadanie:"Calculate TAM/SAM/SOM for [MARKET] in [GEO]. Identify 3 segments with highest willingness to pay and 2 trends.",kontekst:"Product: prompt tool for marketing. GEO: US + EU + DACH. Sources: Statista, LinkedIn Sales Navigator.",ograniczenia:"Numbers with source, don't guess - if no data provide range and assumption, max 500 words",format:"TAM | SAM | SOM (numbers + source) + 3 segments (size, WTP, pain) + 2 trends + Go/No-Go conclusion"},"tlumaczenie-prawnicze":{nazwa:"Legal Translation",opis:"PL-EN with legal force",zadanie:"Translate legal doc [PASTE TEXT PL] into UK lega
